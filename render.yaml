services:
  - type: web
    name: olufunmilyo-sms-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build && npm prune --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGIN
        value: https://carlspat-sms.vercel.app
      - key: SEED_ON_START
        value: "false"
