name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing key
        env:
          ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_B64" || { echo "ANDROID_SIGNING_KEY_B64 secret is missing"; exit 1; }
          echo "$ANDROID_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/carlspat-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/carlspat-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-app
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$ANDROID_SIGNING_PASSWORD" || { echo "ANDROID_SIGNING_PASSWORD secret is missing"; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android-app/app/build/outputs/apk/release/app-release.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: carlspat-school-management-release
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
