name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carlspat
          POSTGRES_PASSWORD: test
          POSTGRES_DB: carlspat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carlspat" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://carlspat:test@localhost:5432/carlspat_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-012345678
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test -- --coverage

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # next build performs full type checking; tsc alone would miss next-env.d.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./server -t carlspat-api
      - run: docker build ./web -t carlspat-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
